# Сервер: бот + PostgreSQL + ежедневный бэкап. Запуск: docker compose -f docker-compose.prod.yml up -d --build
# Если база управляемая (Timeweb Cloud, Yandex Cloud) — уберите сервисы db и backup
# и укажите её адрес в DATABASE_URL в файле .env.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: baram
    volumes:
      - baram-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baram -d baram"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://baram:${POSTGRES_PASSWORD}@db:5432/baram
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # HTTPS для Mini App: сертификат выпускается и продлевается сам.
  # Включается профилем: docker compose -f docker-compose.prod.yml --profile miniapp up -d --build
  caddy:
    image: caddy:2-alpine
    profiles: ["miniapp"]
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${MINIAPP_DOMAIN:-localhost} --to bot:8080
    volumes:
      - caddy-data:/data

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: baram
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: baram
      KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh", "loop"]

volumes:
  baram-db:
  caddy-data:
