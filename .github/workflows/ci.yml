name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка типов
        run: npm run typecheck
      - name: Сверка текстов
        run: python3 scripts/keys.py --strict
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
